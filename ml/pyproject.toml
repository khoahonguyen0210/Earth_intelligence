[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-earth-intelligence-and-forecasting-engine"
version = "0.1.0"
description = "A Python project for learning"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "requests",
    "ruff",
    "mypy",
    "pytest",
    "python-dotenv",
    "cdsapi",
    "xarray",
    "netCDF4",
    "rasterio",
    "scikit-learn",
    "numpy",
    "xgboost",
    "matplotlib",
    "jsonschema",
    "types-jsonschema",
    "google-genai",
    "boto3",
    "moto[s3]"
]
research = [
    "torch>=2.14.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "cdsapi"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rasterio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
