# Loaded on top of src/main/resources/application.properties (Spring Boot
# reads classpath:/config/ after classpath:/), for tests only.
#
# Every test context counts its rate limits under its own
# Redis keys. Test classes all post from 127.0.0.1 into the one compose
# Redis, so a shared key space would let one class's requests use up
# another's budget, depending on test order and timing.
api.rate-limit.key-prefix=ratelimit-test-${random.uuid}:
