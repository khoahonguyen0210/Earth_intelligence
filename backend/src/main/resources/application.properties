spring.application.name=backend

logging.structured.format.console=${LOG_FORMAT:ecs}

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_earth
spring.datasource.username=ai_earth
spring.datasource.password=ai_earth_dev

spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

management.server.port=${MANAGEMENT_PORT:8081}
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,redis

management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.forecast.job.duration=true
management.endpoint.health.show-details=always

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.observations.enable.tasks.scheduled=false
management.observations.enable.lettuce=false
management.otlp.metrics.export.enabled=false

spring.jackson.property-naming-strategy=SNAKE_CASE

api.max-request-bytes=${API_MAX_REQUEST_BYTES:65536}

api.rate-limit.forecasts-per-minute=${RATE_LIMIT_FORECASTS_PER_MINUTE:10}
api.rate-limit.analyses-per-minute=${RATE_LIMIT_ANALYSES_PER_MINUTE:30}
api.rate-limit.queries-per-minute=${RATE_LIMIT_QUERIES_PER_MINUTE:20}
api.rate-limit.key-prefix=${RATE_LIMIT_KEY_PREFIX:ratelimit:}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

analysis.python.executable=${ANALYSIS_PYTHON_EXECUTABLE:python}
analysis.python.script-path=${ANALYSIS_PYTHON_SCRIPT:scripts/query/run_analysis_cli.py}
analysis.python.working-directory=${ANALYSIS_PYTHON_WORKDIR:..}

forecast.python.executable=${FORECAST_PYTHON_EXECUTABLE:python}
forecast.python.script-path=${FORECAST_PYTHON_SCRIPT:scripts/query/run_forecast_cli.py}
forecast.python.working-directory=${FORECAST_PYTHON_WORKDIR:..}

ask-earth.python.executable=${ASK_EARTH_PYTHON_EXECUTABLE:python}
ask-earth.python.script-path=${ASK_EARTH_PYTHON_SCRIPT:scripts/query/run_ask_earth_cli.py}
ask-earth.python.working-directory=${ASK_EARTH_PYTHON_WORKDIR:..}
ask-earth.python.timeout-seconds=${ASK_EARTH_PYTHON_TIMEOUT_SECONDS:180}

forecast.python.timeout-seconds=${FORECAST_PYTHON_TIMEOUT_SECONDS:600}
forecast.worker.max-attempts=${FORECAST_WORKER_MAX_ATTEMPTS:3}

forecast.recovery.interval-seconds=${FORECAST_RECOVERY_INTERVAL_SECONDS:15}
forecast.recovery.running-grace-seconds=${FORECAST_RECOVERY_RUNNING_GRACE_SECONDS:60}
forecast.recovery.queued-after-seconds=${FORECAST_RECOVERY_QUEUED_AFTER_SECONDS:60}
forecast.worker.error-backoff-ms=${FORECAST_WORKER_ERROR_BACKOFF_MS:1000}
spring.task.scheduling.pool.size=2

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT_MS:8000}ms

forecast.queue.key=${FORECAST_QUEUE_KEY:forecast-jobs}
forecast.queue.poll-timeout-seconds=${FORECAST_QUEUE_POLL_TIMEOUT_SECONDS:5}

object-store.endpoint=${OBJECT_STORE_ENDPOINT:http://localhost:9000}
object-store.access-key=${OBJECT_STORE_ACCESS_KEY:ai_earth}
object-store.secret-key=${OBJECT_STORE_SECRET_KEY:ai_earth_dev}
object-store.bucket=${OBJECT_STORE_BUCKET:ai-earth-artifacts}

forecast.store=${FORECAST_STORE:postgres}
dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
dynamodb.region=${AWS_REGION:us-west-2}
dynamodb.access-key=${DYNAMODB_ACCESS_KEY:}
dynamodb.secret-key=${DYNAMODB_SECRET_KEY:}
dynamodb.forecast-table=${FORECAST_JOBS_TABLE:ai-earth-forecast-jobs}
dynamodb.create-table=${DYNAMODB_CREATE_TABLE:false}
dynamodb.inline-result-max-bytes=${DYNAMODB_INLINE_RESULT_MAX_BYTES:262144}
