spring.application.name=backend

# Task 13.1: one JSON object per log line (Elastic Common Schema), using
# Spring Boot's built-in structured logging rather than a hand-rolled
# encoder. ECS supplies @timestamp, log.level, service.name (from
# spring.application.name above), process/thread and logger; MDC entries
# (request_id, job_id, workflow_id) and SLF4J key-value pairs (event,
# duration_ms, error_code, ...) are added as top-level fields. See
# docs/structured-logging.md. LOG_FORMAT=logstash/gelf switch formats;
# there is no plain-text mode, so logs stay machine-parseable everywhere.
logging.structured.format.console=${LOG_FORMAT:ecs}

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_earth
spring.datasource.username=ai_earth
spring.datasource.password=ai_earth_dev

spring.jpa.hibernate.ddl-auto=validate

# Task 13.2: /actuator/prometheus is Prometheus-format text for a scraper
# (docs/metrics.md). Only /actuator/health is routed publicly by the
# cloud ALB (docs/cloud-deployment.md), so the metrics endpoint stays
# in-cluster.
management.endpoints.web.exposure.include=health,prometheus
# Histogram buckets so latency percentiles can be computed server-side
# (histogram_quantile) across replicas, not just per-instance maxima.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.forecast.job.duration=true
management.endpoint.health.show-details=always

# Task 13.3: OpenTelemetry tracing through Micrometer Tracing
# (docs/tracing.md). Every trace is sampled by default: forecast jobs are
# few and each one's trace is the record of where its time went; lower
# TRACING_SAMPLING_PROBABILITY if volume ever makes that costly. Spans are
# exported as OTLP/HTTP only when an endpoint is configured, through the
# standard OpenTelemetry variable Spring Boot maps onto its own property,
# e.g. OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://localhost:4318/v1/traces.
# With none (tests, a bare local run) spans are still created -- log lines
# still get traceId/spanId -- but nothing is sent anywhere.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
# Spring's automatic observations of the @Scheduled worker poll and of
# every Lettuce (Redis) command are off: an idle worker's blocking poll
# would otherwise export a trace -- task span plus BRPOP/HELLO/CLIENT
# spans -- every poll timeout, per replica. The job's own spans
# (forecast.job.attempt, forecast.queue.enqueue) cover that work inside
# real traces. This also drops those two observations' own timers, which
# none of Task 13.2's metrics use (docs/metrics.md).
management.observations.enable.tasks.scheduled=false
management.observations.enable.lettuce=false
# The OpenTelemetry starter also brings Micrometer's OTLP metrics
# registry, which would push every meter to localhost:4318/v1/metrics each
# minute whether or not anything listens. Metrics stay Prometheus-pull
# (Task 13.2, docs/metrics.md); OTLP carries traces only.
management.otlp.metrics.export.enabled=false

management.endpoints.web.cors.allowed-origins=http://localhost:5173
management.endpoints.web.cors.allowed-methods=GET,OPTIONS

spring.jackson.property-naming-strategy=SNAKE_CASE

# Interim Phase 2 bridge to the Python analysis pipeline (subprocess call
# per request). Task 6.2 replaces this with a proper async worker.
# Override analysis.python.executable to point at the project venv's
# interpreter, e.g. ../.venv/Scripts/python.exe on Windows.
analysis.python.executable=${ANALYSIS_PYTHON_EXECUTABLE:python}
analysis.python.script-path=${ANALYSIS_PYTHON_SCRIPT:scripts/query/run_analysis_cli.py}
analysis.python.working-directory=${ANALYSIS_PYTHON_WORKDIR:..}

# Task 6.2 bridge to the Python forecast pipeline (one subprocess call per
# job). Task 6.5 moved the caller from ForecastController to
# ForecastWorker, but the bridge itself is still this same synchronous
# subprocess call.
# Override forecast.python.executable to point at the project venv's
# interpreter, e.g. ../.venv/Scripts/python.exe on Windows.
forecast.python.executable=${FORECAST_PYTHON_EXECUTABLE:python}
forecast.python.script-path=${FORECAST_PYTHON_SCRIPT:scripts/query/run_forecast_cli.py}
forecast.python.working-directory=${FORECAST_PYTHON_WORKDIR:..}

# Task 6.6: how long ForecastRunner waits for the Python subprocess
# before killing it and treating the job as a retryable timeout, and how
# many total attempts (initial + retries) a job gets before a transient
# failure becomes permanent -- see docs/forecast-retry-and-idempotency.md.
forecast.python.timeout-seconds=${FORECAST_PYTHON_TIMEOUT_SECONDS:120}
forecast.worker.max-attempts=${FORECAST_WORKER_MAX_ATTEMPTS:3}

# Task 6.5: Redis (run via `docker compose up -d` in infra/docker/, same
# as Postgres/MinIO) backs the forecast job queue -- see
# docs/forecast-async-jobs.md. Default host is the literal loopback
# address, not "localhost": on this stack Lettuce's startup connection is
# measurably slower resolving "localhost" (IPv6-then-IPv4 fallback) than
# connecting to 127.0.0.1 directly.
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

forecast.queue.key=${FORECAST_QUEUE_KEY:forecast-jobs}
forecast.queue.poll-timeout-seconds=${FORECAST_QUEUE_POLL_TIMEOUT_SECONDS:5}

# Task 6.4: MinIO (S3-API-compatible), run via `docker compose up -d` in
# infra/docker/ -- same credentials as that compose file. Points at real
# AWS S3 unchanged later by overriding these (see S3ClientConfig).
object-store.endpoint=${OBJECT_STORE_ENDPOINT:http://localhost:9000}
object-store.access-key=${OBJECT_STORE_ACCESS_KEY:ai_earth}
object-store.secret-key=${OBJECT_STORE_SECRET_KEY:ai_earth_dev}
object-store.bucket=${OBJECT_STORE_BUCKET:ai-earth-artifacts}