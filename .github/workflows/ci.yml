name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy
          pip install -e .

      - name: Ruff
        working-directory: ml
        run: ruff check .

      - name: Mypy
        working-directory: ml
        run: mypy src

      - name: Pytest
        working-directory: ml
        run: pytest


  java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw clean verify


  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test


  # Task 13.4: dependency vulnerabilities (Maven, uv, npm) and committed
  # secrets, with the same script developers run locally
  # (docs/security-baseline.md).
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Trivy resolves pom.xml's transitive dependencies from the local
      # Maven repository rather than one request per POM to Maven Central.
      - name: Resolve backend dependencies
        working-directory: backend
        run: ./mvnw -q dependency:resolve

      - name: Dependency and secret scan
        run: sh scripts/security/scan.sh
