name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev types-requests

      - name: Ruff
        working-directory: ml
        run: ruff check .

      - name: Mypy
        working-directory: ml
        run: mypy src

      - name: Pytest
        working-directory: ml
        run: pytest


  java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start Postgres, Redis, MinIO, DynamoDB Local and Kafka
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker compose -f infra/docker/docker-compose.yml --profile kafka up -d --wait postgres redis minio dynamodb kafka

      - name: Build and test
        working-directory: backend
        run: ./mvnw clean verify


  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Format and vet
        working-directory: worker
        run: |
          test -z "$(gofmt -l .)"
          go vet -tags integration ./...

      - name: Start Kafka
        run: docker compose -f infra/docker/docker-compose.yml --profile kafka up -d --wait kafka

      - name: Test
        working-directory: worker
        run: go test -race -tags integration ./...


  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test


  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve backend dependencies
        working-directory: backend
        run: ./mvnw -q dependency:resolve

      - name: Dependency and secret scan
        run: sh scripts/security/scan.sh
