# Template only. Copy to secret.yaml (gitignored, same pattern as
# .env/.env.example) and fill in real values before running
# `kubectl apply -f infra/k8s/`.
#
# MinIO's root user/password double as this project's S3-compatible
# access/secret key (application.properties' object-store.access-key
# and object-store.secret-key default to the exact same values the
# docker-compose stack gives MINIO_ROOT_USER/MINIO_ROOT_PASSWORD).
# backend.yaml points OBJECT_STORE_ACCESS_KEY/OBJECT_STORE_SECRET_KEY
# at these same two keys directly, so there is only one place to set
# this credential, not two that could drift out of sync.
apiVersion: v1
kind: Secret
metadata:
  name: ai-earth-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""
  MINIO_ROOT_USER: ""
  MINIO_ROOT_PASSWORD: ""
  # data.firms requires this real NASA FIRMS credential
  # unconditionally -- see docs/clean-start-test.md for why the backend
  # pod fails without it.
  FIRMS_MAP_KEY: ""
