# No runtime env: the built bundle calls the browser's own
# http://localhost:8080 (frontend/Dockerfile, src/api/client.ts)
# unchanged from the Docker Compose stack. On a local cluster this
# means `kubectl port-forward svc/backend 8080:8080` is what actually
# satisfies that hardcoded address for a browser hitting the frontend
# -- backend.yaml's NodePort 30080 is for direct API access/health
# checks, not what the compiled frontend calls. See
# docs/kubernetes-manifests.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ai-earth-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30173
