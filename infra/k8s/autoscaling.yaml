apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: backend-forecast-queue
spec:
  scaleTargetRef:
    name: backend
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: redis
      metadata:
        address: redis.default.svc.cluster.local:6379
        listName: forecast-jobs
        listLength: "1"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
