services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: ai-earth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_earth
      POSTGRES_USER: ai_earth
      POSTGRES_PASSWORD: ai_earth_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_earth -d ai_earth"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    container_name: ai-earth-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ai_earth
      MINIO_ROOT_PASSWORD: ai_earth_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-earth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:2.6.0
    container_name: ai-earth-dynamodb
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    container_name: ai-earth-kafka
    restart: unless-stopped
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: ai-earth-jaeger
    restart: unless-stopped
    ports:
      - "4318:4318"
      - "16686:16686"

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: ai-earth-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    env_file:
      - ../../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_earth
      REDIS_HOST: redis
      OBJECT_STORE_ENDPOINT: http://minio:9000
      FORECAST_STORE: ${FORECAST_STORE:-postgres}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_ACCESS_KEY: local
      DYNAMODB_SECRET_KEY: local
      DYNAMODB_CREATE_TABLE: "true"
      FORECAST_QUEUE: ${FORECAST_QUEUE:-redis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  forecast-worker:
    build:
      context: ../../worker
    container_name: ai-earth-forecast-worker
    restart: unless-stopped
    profiles: ["kafka"]
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      BACKEND_RUN_URL: http://backend:8081/actuator/forecastjobs
      WORKER_CONCURRENCY: "2"
    healthcheck:
      test: ["CMD", "/forecast-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    container_name: ai-earth-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  minio_data:
  redis_data:
  kafka_data:
